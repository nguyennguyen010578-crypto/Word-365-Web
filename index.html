    <script>
        // --- RESET FUNCTIONALITY IMPLEMENTATION --- //
        let selectedResetType = 'docOnly';

        function openResetModal() {
            document.getElementById('resetModal').classList.remove('hidden');
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.add('hidden');
        }

        function confirmReset(type) {
            selectedResetType = type;
            document.getElementById('resetDocOnly').checked = (type === 'docOnly');
            document.getElementById('resetFullApp').checked = (type === 'fullApp');
        }

        function executeReset() {
            const editor = document.getElementById('editor');
            const watermark = document.getElementById('watermarkDisplay');
            const drawCanvas = document.getElementById('drawCanvas');
            
            if (selectedResetType === 'docOnly' || selectedResetType === 'fullApp') {
                // Clear Document Content & Reset Page Setup
                editor.innerHTML = '<p>Nhập nội dung văn bản của bạn tại đây...</p>';
                watermark.innerText = '';
                
                // Clear Draw Canvas
                if (drawCanvas) {
                    const ctx = drawCanvas.getContext('2d');
                    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                }

                // Reset document title
                document.getElementById('docTitleDisplay').innerText = 'Văn bản chưa đặt tên - Word';

                // Save blank state to local storage
                localStorage.removeItem('ms_word_clone_content');
                localStorage.removeItem('ms_word_clone_watermark');
            }

            if (selectedResetType === 'fullApp') {
                // Clear all local storage related to application
                localStorage.clear();

                // Reset Zoom
                zoomLevel = 100;
                applyZoom();

                // Reset Theme Mode
                document.documentElement.classList.remove('dark');

                // Reset Ruler Visibility
                const ruler = document.getElementById('rulerHeader');
                if (ruler) ruler.classList.remove('hidden');
            }

            closeResetModal();
            updateDocumentStats();
            
            // Show toast feedback
            showToast(selectedResetType === 'fullApp' ? 'Đã đặt lại toàn bộ ứng dụng và dữ liệu thành công!' : 'Đã đặt lại nội dung văn bản về mặc định!');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-lg text-xs z-50 flex items-center gap-2 animate-bounce';
            toast.innerHTML = `<i class="fas fa-circle-check text-green-400"></i> <span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // ... existing code ...
